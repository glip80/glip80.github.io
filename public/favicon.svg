<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#B537F2"/>
    </linearGradient>
  </defs>
  
  <!-- Modern AP monogram -->
  <g transform="translate(256, 256)">
    <!-- A -->
    <path d="M -90 80 L -40 -80 L 10 -80 L 60 80 L 20 80 L 10 50 L -50 50 L -60 80 Z M -40 20 L 0 20 L -20 -40 Z" 
          fill="url(#text-gradient)" stroke="url(#text-gradient)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- P -->
    <path d="M 70 -80 L 70 80 L 30 80 L 30 10 L 30 -40 L 90 -40 Q 130 -40 130 -60 Q 130 -80 90 -80 Z M 70 -50 L 90 -50 Q 100 -50 100 -60 Q 100 -70 90 -70 L 70 -70 Z" 
          fill="url(#text-gradient)" stroke="url(#text-gradient)" stroke-width="4" stroke-linejoin="round"/>
  </g>
  
  <!-- Subtle decorative elements -->
  <circle cx="100" cy="100" r="4" fill="#00D4FF" opacity="0.6"/>
  <circle cx="412" cy="100" r="4" fill="#B537F2" opacity="0.6"/>
  <circle cx="100" cy="412" r="4" fill="#7C3AED" opacity="0.6"/>
  <circle cx="412" cy="412" r="4" fill="#00D4FF" opacity="0.6"/>
</svg>
